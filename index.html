<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria 3 – Parliament & Economic Report Tool</title>
    <style>
        :root {
            --bg: #1a1a1f;
            --surface: #24242b;
            --surface2: #2d2d36;
            --text: #e0d8cc;
            --text2: #b0a89a;
            --gold: #c9a84c;
            --gold-dim: #8a7030;
            --red: #b84c3b;
            --border: #3a3a42;
            --font-heading: 'Georgia', 'Times New Roman', serif;
            --font-body: 'Segoe UI', system-ui, sans-serif;
            --radius: 8px;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            line-height: 1.6;
        }
        .header {
            background: linear-gradient(180deg, #2a2418 0%, #1e1a14 100%);
            border-bottom: 2px solid var(--gold-dim);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header .logo {
            font-family: var(--font-heading);
            font-size: 1.6em;
            color: var(--gold);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .header .logo span {
            color: #d4b86a;
            font-size: 0.7em;
            display: block;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .nav-tabs {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .nav-tab {
            padding: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.9em;
            transition: all 0.25s;
            border-radius: var(--radius) var(--radius) 0 0;
            white-space: nowrap;
        }
        .nav-tab:hover {
            color: var(--gold);
            background: #2a2a32;
            border-color: var(--gold-dim);
        }
        .nav-tab.active {
            background: var(--surface2);
            color: var(--gold);
            border-color: var(--gold) var(--gold) transparent var(--gold);
            font-weight: bold;
        }
        .nav-tab .badge {
            display: inline-block;
            background: var(--red);
            color: #fff;
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 0.7em;
            margin-left: 4px;
        }
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.35s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        .card h2 {
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 1.3em;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .card h3 {
            font-family: var(--font-heading);
            color: #c9b878;
            font-size: 1.05em;
            margin: 12px 0 8px;
        }
        .diagram-wrapper {
            background: transparent;
            border-radius: 4px;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }
        .diagram-wrapper svg {
            width: 100%;
            height: auto;
            display: block;
            background: transparent;
        }
        .party-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        .party-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 2px solid transparent;
            border-radius: 20px;
            padding: 8px 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            user-select: none;
        }
        .party-chip:hover {
            border-color: var(--gold-dim);
        }
        .party-chip.governing {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(201, 168, 76, 0.3);
        }
        .party-chip .swatch {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .party-chip .seat-count {
            font-weight: bold;
            color: #fff;
        }
        .party-chip .party-name {
            color: var(--text2);
        }
        .party-chip select {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.8em;
            cursor: pointer;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.9em;
            border: 1px solid var(--border);
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            color: var(--text);
        }
        .btn-primary {
            background: var(--gold-dim);
            color: #fff;
            border-color: var(--gold);
        }
        .btn-primary:hover {
            background: var(--gold);
            box-shadow: 0 0 16px rgba(201, 168, 76, 0.3);
        }
        .btn-danger {
            background: #5a2a22;
            color: #faa;
            border-color: #8a3a2a;
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 0.8em;
            border-radius: 14px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        input,
        select,
        textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: var(--radius);
            font-family: var(--font-body);
            font-size: 0.9em;
        }
        label {
            font-size: 0.85em;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--gold-dim);
        }
        .timeline-entry {
            position: relative;
            margin-bottom: 20px;
            padding: 14px 18px;
            background: var(--surface2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .timeline-entry:hover {
            border-color: var(--gold-dim);
        }
        .timeline-entry::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            border: 2px solid var(--surface2);
        }
        .report-paper {
            background: #faf8f2;
            color: #2a2418;
            padding: 40px 36px;
            border-radius: 4px;
            font-family: 'Georgia', serif;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid #d0c8b0;
        }
        .report-header {
            text-align: center;
            border-bottom: 2px solid #c9a84c;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .report-header .bank-name {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #6b5c3e;
        }
        .report-header .report-title {
            font-size: 1.8em;
            color: #2a2418;
            margin: 6px 0;
            letter-spacing: 1px;
        }
        .report-header .country-year {
            font-size: 1.3em;
            color: #8a7030;
            font-style: italic;
        }
        .report-section {
            margin: 20px 0;
        }
        .report-section h3 {
            color: #4a3820;
            border-bottom: 1px solid #d0c8b0;
            padding-bottom: 4px;
        }
        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }
        .report-table th,
        .report-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #e0d8c8;
            text-align: left;
        }
        .report-table th {
            background: #f0ece0;
            color: #4a3820;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .report-table .num {
            text-align: right;
            font-family: 'Courier New', monospace;
        }
        .report-footer {
            border-top: 1px solid #d0c8b0;
            margin-top: 30px;
            padding-top: 12px;
            font-size: 0.75em;
            color: #8a8070;
            text-align: center;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
            aspect-ratio: 16/10;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
        }
        .upload-zone:hover {
            border-color: var(--gold);
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--surface2);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2a2a32;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 20px;
            border-radius: 20px;
            z-index: 300;
            animation: slideUp 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Victoria 3 <span>Parliament & Economic Reports</span></div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="parliament">🏛️ Parliament</button>
            <button class="nav-tab" data-tab="history">📜 History <span class="badge" id="historyCount">0</span></button>
            <button class="nav-tab" data-tab="economy">📊 Economic Report</button>
            <button class="nav-tab" data-tab="screenshots">🖼️ Screenshots</button>
        </div>
    </div>

    <div class="main-container">
        <div class="tab-content active" id="parliamentTab">
            <div class="card">
                <h2>🏛️ Parliament Diagram</h2>
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
                    <label>Total Seats:</label>
                    <input type="number" id="totalSeats" value="169" min="10" max="800" step="1" style="width:80px;">
                    <button class="btn btn-sm" onclick="updateTotalSeats()">Apply</button>
                    <span style="color:var(--text2);" id="seatSummary">169 seats</span>
                    <button class="btn btn-sm" style="margin-left:auto;" onclick="sortPartiesByPosition()">📊 Sort L→R by Position</button>
                </div>
                <div class="diagram-wrapper">
                    <svg id="parliamentSvg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
            <div class="card">
                <h2>🎯 Parties</h2>
                <div class="party-list" id="partyList"></div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="addParty()">+ Add Party</button>
                    <button class="btn" onclick="formGovernment()">🤝 Form Government</button>
                    <button class="btn" onclick="saveToHistory()">💾 Save to History</button>
                    <button class="btn btn-danger btn-sm" onclick="resetParliament()">Reset All</button>
                </div>
            </div>
        </div>

        <div class="tab-content" id="historyTab">
            <div class="card">
                <h2>📜 Government History</h2>
                <div class="timeline" id="historyTimeline"></div>
                <div class="btn-row"><button class="btn btn-danger btn-sm" onclick="clearHistory()">Clear</button><button class="btn btn-sm" onclick="exportHistory()">Export JSON</button></div>
            </div>
        </div>

        <div class="tab-content" id="economyTab">
            <div class="card">
                <h2>📊 Yearly Economic Report</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
                    <div><label>Country</label><input type="text" id="ecoCountry" value="Great Britain"></div>
                    <div><label>Year</label><input type="number" id="ecoYear" value="1890"></div>
                    <div><label>GDP (£M)</label><input type="number" id="ecoGDP" value="24500"></div>
                    <div><label>Growth (%)</label><input type="number" id="ecoGrowth" value="2.8"></div>
                    <div><label>GDP per Capita (£)</label><input type="number" id="ecoGDPpc" value="620"></div>
                    <div><label>Inflation (%)</label><input type="number" id="ecoInflation" value="1.4"></div>
                    <div><label>Unemployment (%)</label><input type="number" id="ecoUnemp" value="4.2"></div>
                    <div><label>Revenue (£M)</label><input type="number" id="ecoRevenue" value="3200"></div>
                    <div><label>Expenditure (£M)</label><input type="number" id="ecoExpend" value="3450"></div>
                    <div><label>Debt (£M)</label><input type="number" id="ecoDebt" value="18200"></div>
                    <div><label>Trade Balance (£M)</label><input type="number" id="ecoTrade" value="-120"></div>
                    <div><label>Gold Reserves (£M)</label><input type="number" id="ecoGold" value="840"></div>
                </div>
                <div style="margin-top:12px;"><label>Sectors (name,value per line)</label><textarea id="ecoSectors" rows="4">Manufacturing,8200&#10;Agriculture,3400&#10;Mining,2900&#10;Trade,5100&#10;Finance,2800</textarea></div>
                <div style="margin-top:12px;"><label>Executive Summary</label><textarea id="ecoNotes" rows="3">Steady industrial expansion continues...</textarea></div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="generateReport()">📄 Generate Report</button>
                    <button class="btn" onclick="printReport()">🖨️ Print</button>
                    <button class="btn" onclick="saveEconomicReport()">💾 Save Report</button>
                </div>
            </div>
            <div class="card print-card" id="reportContainer" style="display:none;"><h2>📄 Report</h2><div id="reportContent"></div></div>
            <div class="card"><h2>📁 Saved Reports</h2><div id="savedReportsList"></div></div>
        </div>

        <div class="tab-content" id="screenshotsTab">
            <div class="card">
                <h2>🖼️ Screenshots</h2>
                <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">📁 Click or drop images here</div>
                <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="handleFileUpload(event)">
                <div class="gallery-grid" id="galleryGrid" style="margin-top:16px;"></div>
                <div class="btn-row"><button class="btn btn-danger btn-sm" onclick="clearScreenshots()">Clear All</button></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;" onclick="closeModal(event)"><div class="modal" id="modalContent" onclick="event.stopPropagation()"></div></div>
    <div id="toastContainer"></div>

    <script>
        (function() {
            const canStore = (() => { try { localStorage.setItem('t', 't');
                    localStorage.removeItem('t'); return true; } catch (e) { return false; } })();
            const load = () => { if (!canStore) return null; try { return JSON.parse(localStorage.getItem(
                    'vic3_parliament_tool')); } catch (e) { return null; } };
            const save = (d) => { if (!canStore) return; try { localStorage.setItem('vic3_parliament_tool', JSON.stringify(
                    d)); } catch (e) {} };

            const POSITIONS = ['far-left', 'left', 'center-left', 'center', 'center-right', 'right', 'far-right'];
            const POSITION_ORDER = { 'far-left': 0, 'left': 1, 'center-left': 2, 'center': 3, 'center-right': 4, 'right': 5,
                'far-right': 6 };

            const DEFAULT = [
                { name: 'Labour', color: '#c74440', seats: 42, governing: false, position: 'left' },
                { name: 'Irish Parl.', color: '#5a9a5a', seats: 28, governing: false, position: 'center-left' },
                { name: 'Liberal', color: '#e8a830', seats: 54, governing: false, position: 'center' },
                { name: 'Conservative', color: '#3a6ba5', seats: 35, governing: true, position: 'right' },
                { name: 'Independent', color: '#888888', seats: 10, governing: false, position: 'center' }
            ];

            let state = { totalSeats: 169, parties: JSON.parse(JSON.stringify(DEFAULT)), history: [],
                screenshots: [], savedReports: [] };
            const stored = load();
            if (stored) { state.totalSeats = stored.totalSeats || 169;
                state.parties = stored.parties || JSON.parse(JSON.stringify(DEFAULT));
                state.history = stored.history || [];
                state.screenshots = stored.screenshots || [];
                state.savedReports = stored.savedReports || []; }

            function persist() { save({ totalSeats: state.totalSeats, parties: state.parties, history: state.history.slice(
                        -50), screenshots: state.screenshots.slice(-30), savedReports: state.savedReports.slice(-20) }); }

            function toast(msg) { const c = document.getElementById('toastContainer'); const t = document.createElement(
                    'div');
                t.className = 'toast';
                t.textContent = msg;
                c.appendChild(t);
                setTimeout(() => t.remove(), 3000); }

            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active');
                    const target = document.getElementById(tab.dataset.tab + 'Tab');
                    if (target) target.classList.add('active');
                    if (tab.dataset.tab === 'history') renderHistory();
                    if (tab.dataset.tab === 'screenshots') renderGallery();
                    if (tab.dataset.tab === 'economy') renderSavedReports();
                });
            });

            // ── Geometry constants (larger blocks) ──
            const VIEW_W = 1000;
            const VIEW_H = 800;
            const ARC_CX = 500;
            const ARC_CY = 580;
            const OUTER_R = 400;
            const INNER_R = 160;
            const ROW_SPACING = 32; // increased for larger blocks
            const BLOCK_W = 16; // larger mandates
            const BLOCK_H = 22; // slightly taller than wide
            const BLOCK_GAP_X = 16;
            const AISLE_HALF = 14;
            const STRAIGHT_ROWS = 4;
            const STRAIGHT_Y_START = 610;

            function computeBlockPositions(totalSeats) {
                const archRows = Math.floor((OUTER_R - INNER_R) / ROW_SPACING) + 1;
                let allPositions = [];

                for (let row = 0; row < archRows; row++) {
                    const radius = OUTER_R - row * ROW_SPACING;
                    if (radius < INNER_R) break;
                    const maxHorizOffset = Math.min(415, radius * 0.98);
                    const minAngle = Math.acos(maxHorizOffset / radius);
                    const maxAngle = Math.PI - minAngle;
                    const angularSpan = maxAngle - minAngle;
                    const aisleAngle = 2 * Math.asin(AISLE_HALF / radius);
                    const usableSpan = angularSpan - aisleAngle;
                    const arcLength = radius * usableSpan;
                    const maxBlocks = Math.max(1, Math.floor(arcLength / (BLOCK_W + BLOCK_GAP_X)));
                    const halfAngle = (angularSpan - aisleAngle) / 2;
                    const leftStart = maxAngle;
                    const leftEnd = Math.PI / 2 + aisleAngle / 2;
                    const rightStart = Math.PI / 2 - aisleAngle / 2;
                    const rightEnd = minAngle;
                    const leftSpan = leftStart - leftEnd;
                    const rightSpan = rightStart - rightEnd;
                    const totalSpan = leftSpan + rightSpan;
                    const leftCount = Math.round(maxBlocks * leftSpan / totalSpan);
                    const rightCount = maxBlocks - leftCount;

                    for (let i = 0; i < leftCount; i++) {
                        const frac = leftCount > 1 ? i / (leftCount - 1) : 0.5;
                        const angle = leftStart - frac * leftSpan;
                        const x = ARC_CX + radius * Math.cos(angle);
                        const y = ARC_CY - radius * Math.sin(angle);
                        const rotation = (angle - Math.PI / 2) * (180 / Math.PI);
                        allPositions.push({ x, y, rotation, isArch: true, radius, angle, side: 'left' });
                    }
                    for (let i = 0; i < rightCount; i++) {
                        const frac = rightCount > 1 ? i / (rightCount - 1) : 0.5;
                        const angle = rightStart - frac * rightSpan;
                        const x = ARC_CX + radius * Math.cos(angle);
                        const y = ARC_CY - radius * Math.sin(angle);
                        const rotation = (angle - Math.PI / 2) * (180 / Math.PI);
                        allPositions.push({ x, y, rotation, isArch: true, radius, angle, side: 'right' });
                    }
                }

                // Straight rows
                const lowestArchAngle = Math.acos(415 / OUTER_R);
                const leftBound = ARC_CX + OUTER_R * Math.cos(Math.PI - lowestArchAngle);
                const rightBound = ARC_CX + OUTER_R * Math.cos(lowestArchAngle);
                const usableWidth = (rightBound - leftBound) - 2 * AISLE_HALF;
                const blocksPerSide = Math.floor(usableWidth / 2 / (BLOCK_W + BLOCK_GAP_X));

                for (let row = 0; row < STRAIGHT_ROWS; row++) {
                    const y = STRAIGHT_Y_START + row * ROW_SPACING;
                    const leftStartX = leftBound + (usableWidth / 2 - blocksPerSide * (BLOCK_W + BLOCK_GAP_X)) / 2;
                    for (let i = 0; i < blocksPerSide; i++) {
                        const x = leftStartX + i * (BLOCK_W + BLOCK_GAP_X) + BLOCK_W / 2;
                        if (x < ARC_CX - AISLE_HALF - BLOCK_W / 2) {
                            allPositions.push({ x, y, rotation: 0, isArch: false, side: 'left' });
                        }
                    }
                    const rightStartX = ARC_CX + AISLE_HALF + (usableWidth / 2 - blocksPerSide * (BLOCK_W + BLOCK_GAP_X)) /
                        2;
                    for (let i = 0; i < blocksPerSide; i++) {
                        const x = rightStartX + i * (BLOCK_W + BLOCK_GAP_X) + BLOCK_W / 2;
                        if (x > ARC_CX + AISLE_HALF + BLOCK_W / 2) {
                            allPositions.push({ x, y, rotation: 0, isArch: false, side: 'right' });
                        }
                    }
                }

                // Sort positions left to right for assignment
                const archPositions = allPositions.filter(p => p.isArch).sort((a, b) => b.angle - a.angle);
                const straightPositions = allPositions.filter(p => !p.isArch).sort((a, b) => a.x - b.x);
                const sortedPositions = [...archPositions, ...straightPositions];

                if (sortedPositions.length > totalSeats) {
                    return sortedPositions.slice(0, totalSeats);
                }
                while (sortedPositions.length < totalSeats) {
                    sortedPositions.push({
                        x: ARC_CX + (sortedPositions.length % 2 === 0 ? 50 : -50),
                        y: STRAIGHT_Y_START + STRAIGHT_ROWS * ROW_SPACING + 30,
                        rotation: 0,
                        isArch: false,
                        side: 'extra'
                    });
                }
                return sortedPositions;
            }

            function sortPartiesByPosition() {
                state.parties.sort((a, b) => (POSITION_ORDER[a.position] || 0) - (POSITION_ORDER[b.position] || 0));
                refresh();
                toast('Parties sorted left to right.');
            }

            function renderParliament() {
                const svg = document.getElementById('parliamentSvg');
                const total = state.totalSeats;
                // Sort parties by position before rendering
                const sortedParties = [...state.parties].sort((a, b) => (POSITION_ORDER[a.position] || 0) - (POSITION_ORDER[b
                    .position] || 0));
                const assigned = sortedParties.reduce((s, p) => s + p.seats, 0);
                const unassigned = Math.max(0, total - assigned);

                const positions = computeBlockPositions(total);
                let posIdx = 0;
                const assignments = [];
                sortedParties.forEach(p => {
                    for (let i = 0; i < p.seats && posIdx < positions.length; i++) {
                        assignments.push({ ...positions[posIdx], party: p, governing: p.governing });
                        posIdx++;
                    }
                });
                while (posIdx < positions.length) {
                    assignments.push({ ...positions[posIdx], party: null, governing: false });
                    posIdx++;
                }

                // Background: mini parliament chamber feel
                let svgContent = `
                    <defs>
                        <radialGradient id="chamberGlow" cx="50%" cy="80%" r="60%">
                            <stop offset="0%" stop-color="#3a3020" stop-opacity="0.6"/>
                            <stop offset="100%" stop-color="#1a1410" stop-opacity="0.9"/>
                        </radialGradient>
                        <pattern id="wood" patternUnits="userSpaceOnUse" width="30" height="30">
                            <rect width="30" height="30" fill="#4a3820"/>
                            <path d="M0 15 Q7 13 15 15 T30 15" stroke="#3a2a10" fill="none" stroke-width="0.8" opacity="0.3"/>
                        </pattern>
                    </defs>
                    <rect width="${VIEW_W}" height="${VIEW_H}" fill="url(#wood)" opacity="0.8"/>
                    <rect width="${VIEW_W}" height="${VIEW_H}" fill="url(#chamberGlow)"/>
                    <!-- Arch outline -->
                    <path d="M${ARC_CX - OUTER_R + 10},${ARC_CY} Q${ARC_CX},${ARC_CY - OUTER_R - 20} ${ARC_CX + OUTER_R - 10},${ARC_CY}" fill="none" stroke="#6b5c3e" stroke-width="2" opacity="0.5"/>
                    <!-- Center aisle -->
                    <rect x="${ARC_CX - AISLE_HALF}" y="0" width="${AISLE_HALF*2}" height="${VIEW_H}" fill="#2a2418" opacity="0.6"/>
                    <line x1="${ARC_CX}" y1="0" x2="${ARC_CX}" y2="${VIEW_H}" stroke="#6b5c3e" stroke-width="1" opacity="0.4"/>
                `;

                assignments.forEach(seat => {
                    const color = seat.party ? seat.party.color : '#aaa';
                    const name = seat.party ? seat.party.name : 'Unassigned';
                    const stroke = seat.governing ? '#000' : '#888';
                    const strokeWidth = seat.governing ? '1.5' : '0.8';

                    if (seat.isArch) {
                        svgContent += `
                        <g transform="translate(${seat.x.toFixed(2)}, ${seat.y.toFixed(2)}) rotate(${seat.rotation.toFixed(2)})">
                          <rect x="${(-BLOCK_W/2).toFixed(2)}" y="${(-BLOCK_H/2).toFixed(2)}" width="${BLOCK_W}" height="${BLOCK_H}" rx="3" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" data-party="${name}" data-governing="${seat.governing}">
                            <title>${name}${seat.governing ? ' (Governing)' : ''}</title>
                          </rect>
                        </g>`;
                    } else {
                        svgContent += `
                        <rect x="${(seat.x - BLOCK_W/2).toFixed(2)}" y="${(seat.y - BLOCK_H/2).toFixed(2)}" width="${BLOCK_W}" height="${BLOCK_H}" rx="3" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" data-party="${name}" data-governing="${seat.governing}">
                          <title>${name}${seat.governing ? ' (Governing)' : ''}</title>
                        </rect>`;
                    }
                });

                // Seat count label
                svgContent +=
                    `<text x="${ARC_CX}" y="${VIEW_H - 15}" text-anchor="middle" fill="#e0d8cc" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" opacity="0.8">${total}</text>`;

                svg.innerHTML = svgContent;
                document.getElementById('seatSummary').textContent = `${total} total seats | ${unassigned} unassigned`;
                document.getElementById('historyCount').textContent = state.history.length;
                renderPartyList();
            }

            function renderPartyList() {
                const container = document.getElementById('partyList');
                const sorted = [...state.parties].sort((a, b) => (POSITION_ORDER[a.position] || 0) - (POSITION_ORDER[b
                    .position] || 0));
                const unassigned = Math.max(0, state.totalSeats - state.parties.reduce((s, p) => s + p.seats, 0));
                let html = '';
                sorted.forEach((p, idx) => {
                    const realIndex = state.parties.indexOf(p); // find original index for mutation
                    html += `
                    <div class="party-chip${p.governing ? ' governing' : ''}" onclick="toggleGoverning(${realIndex})">
                      <span class="swatch" style="background:${p.color};"></span>
                      <span class="party-name">${p.name}</span>
                      <span class="seat-count">${p.seats}</span>
                      <select onclick="event.stopPropagation();" onchange="updatePartyPosition(${realIndex}, this.value)" value="${p.position}">
                        ${POSITIONS.map(pos => `<option value="${pos}" ${p.position === pos ? 'selected' : ''}>${pos}</option>`).join('')}
                      </select>
                      <button class="btn-sm" onclick="event.stopPropagation(); adjustSeats(${realIndex}, -1)">−</button>
                      <button class="btn-sm" onclick="event.stopPropagation(); adjustSeats(${realIndex}, 1)">+</button>
                      <button class="btn-sm" style="background:#5a2a22;border-color:#8a3a2a;color:#faa;" onclick="event.stopPropagation(); removeParty(${realIndex})">×</button>
                    </div>`;
                });
                if (unassigned > 0) html +=
                    `<span style="color:var(--text2);padding:8px;">+ ${unassigned} unassigned</span>`;
                container.innerHTML = html;
            }

            window.updatePartyPosition = (idx, newPos) => {
                state.parties[idx].position = newPos;
                refresh();
            };

            window.adjustSeats = (idx, delta) => {
                const p = state.parties[idx];
                const newSeats = p.seats + delta;
                if (newSeats < 0) return;
                const other = state.parties.reduce((s, pt, i) => s + (i === idx ? 0 : pt.seats), 0);
                if (newSeats + other > state.totalSeats && delta > 0) { toast('Not enough unassigned seats!'); return; }
                p.seats = newSeats;
                refresh();
            };
            window.toggleGoverning = (idx) => { state.parties[idx].governing = !state.parties[idx].governing;
                refresh(); };
            window.removeParty = (idx) => { if (state.parties.length <= 1) { toast('Need at least one party!'); return; }
                state.parties.splice(idx, 1);
                refresh();
                toast('Party removed.'); };
            window.addParty = () => { const name = prompt('Party name:', 'New Party'); if (!name || !name.trim())
                return;
                state.parties.push({ name: name.trim(), color: '#' + Math.floor(Math.random() * 16777215).toString(
                        16).padStart(6, '0'), seats: 0, governing: false, position: 'center' });
                refresh();
                toast(`Added "${name.trim()}"`); };
            window.updateTotalSeats = () => { const val = parseInt(document.getElementById('totalSeats').value) || 169;
                state.totalSeats = Math.max(5, Math.min(800, val));
                document.getElementById('totalSeats').value = state.totalSeats;
                refresh(); };
            window.formGovernment = () => { const gov = state.parties.filter(p => p.governing); const seats = gov.reduce((s,
                    p) => s + p.seats, 0); if (!gov.length) toast('Select at least one governing party.'); else if (
                    seats < state.totalSeats / 2) toast(`Minority government (${seats} seats).`); else toast(
                    `Government formed with ${seats} seats.`); };
            window.saveToHistory = () => { const entry = { date: new Date().toISOString(), label: prompt('Label:',
                        'Government ' + (state.history.length + 1)) || 'Government', totalSeats: state.totalSeats,
                    parties: JSON.parse(JSON.stringify(state.parties)) };
                state.history.unshift(entry); if (state.history.length > 50) state.history = state.history.slice(0,
                50);
                persist();
                renderHistory();
                toast('Saved!'); };
            window.resetParliament = () => { if (confirm('Reset to default?')) { state.totalSeats = 169;
                    state.parties = JSON.parse(JSON.stringify(DEFAULT));
                    document.getElementById('totalSeats').value = 169;
                    refresh(); } };

            function refresh() { renderParliament();
                persist(); }

            function renderHistory() {
                const container = document.getElementById('historyTimeline');
                if (!state.history.length) { container.innerHTML = '<p>No saved governments yet.</p>'; return; }
                container.innerHTML = state.history.map((e, i) => `
                  <div class="timeline-entry" onclick="viewHistory(${i})">
                    <div class="date">${new Date(e.date).toLocaleDateString()}</div>
                    <div class="gov-name">${e.label}</div>
                  </div>`).join('');
                document.getElementById('historyCount').textContent = state.history.length;
            }
            window.clearHistory = () => { if (confirm('Clear history?')) { state.history = [];
                    persist();
                    renderHistory(); } };
            window.exportHistory = () => { const b = new Blob([JSON.stringify(state.history)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(b);
                a.download = 'history.json';
                a.click(); };
            window.viewHistory = (idx) => { const e = state.history[idx]; const modal = document.getElementById(
                    'modalContent');
                modal.innerHTML =
                    `<button class="btn btn-sm" onclick="closeModalDirect()">✕</button><h3>${e.label}</h3><p>Seats: ${e.totalSeats}</p><button class="btn btn-primary" onclick="restoreHistory(${idx})">Restore</button>`;
                document.getElementById('modalOverlay').style.display = 'flex'; };
            window.restoreHistory = (idx) => { const e = state.history[idx];
                state.totalSeats = e.totalSeats;
                state.parties = JSON.parse(JSON.stringify(e.parties));
                document.getElementById('totalSeats').value = e.totalSeats;
                refresh();
                closeModalDirect();
                toast('Parliament restored!'); };

            window.generateReport = () => {
                const country = document.getElementById('ecoCountry').value || 'Unknown';
                const year = document.getElementById('ecoYear').value || '18--';
                const gdp = parseFloat(document.getElementById('ecoGDP').value) || 0;
                const growth = parseFloat(document.getElementById('ecoGrowth').value) || 0;
                const revenue = parseFloat(document.getElementById('ecoRevenue').value) || 0;
                const expend = parseFloat(document.getElementById('ecoExpend').value) || 0;
                const debt = parseFloat(document.getElementById('ecoDebt').value) || 0;
                const balance = revenue - expend;
                const html = `
                <div class="report-paper">
                  <div class="report-header">
                    <div class="bank-name">Royal Economic Intelligence</div>
                    <div class="report-title">Annual Economic Report</div>
                    <div class="country-year">${country} — ${year}</div>
                  </div>
                  <div class="report-section"><h3>Summary</h3><p>${document.getElementById('ecoNotes').value}</p></div>
                  <div class="report-section">
                    <h3>Key Indicators</h3>
                    <table class="report-table">
                      <tr><td>GDP</td><td class="num">£${(gdp/1000).toFixed(1)}B</td></tr>
                      <tr><td>Growth</td><td class="num">${growth}%</td></tr>
                      <tr><td>Balance</td><td class="num">£${balance}M</td></tr>
                      <tr><td>Debt</td><td class="num">£${debt}M</td></tr>
                    </table>
                  </div>
                  <div class="report-footer">Generated ${new Date().toLocaleDateString()}</div>
                </div>`;
                document.getElementById('reportContent').innerHTML = html;
                document.getElementById('reportContainer').style.display = 'block';
                toast('Report generated!');
            };
            window.printReport = () => { if (!document.getElementById('reportContent').innerHTML) toast(
                    'Generate report first'); else window.print(); };
            window.saveEconomicReport = () => { const html = document.getElementById('reportContent').innerHTML; if (!html) { toast(
                        'Generate report first'); return; }
                state.savedReports.unshift({ date: new Date().toISOString(), country: document.getElementById(
                        'ecoCountry').value, year: document.getElementById('ecoYear').value, html }); if (state
                    .savedReports.length > 20) state.savedReports = state.savedReports.slice(0, 20);
                persist();
                renderSavedReports();
                toast('Report saved!'); };

            function renderSavedReports() {
                const container = document.getElementById('savedReportsList');
                if (!state.savedReports.length) { container.innerHTML = '<p>No saved reports.</p>'; return; }
                container.innerHTML = state.savedReports.map((r, i) =>
                    `<div style="display:flex;align-items:center;gap:12px;padding:8px;border-bottom:1px solid var(--border);"><span>${r.country} ${r.year}</span><button class="btn btn-sm" onclick="loadSavedReport(${i})">View</button><button class="btn btn-sm btn-danger" onclick="deleteSavedReport(${i})">Del</button></div>`
                    ).join('');
            }
            window.loadSavedReport = (i) => { document.getElementById('reportContent').innerHTML = state.savedReports[i]
                    .html;
                document.getElementById('reportContainer').style.display = 'block'; };
            window.deleteSavedReport = (i) => { if (confirm('Delete?')) { state.savedReports.splice(i, 1);
                    persist();
                    renderSavedReports(); } };

            window.handleFileUpload = (e) => {
                const files = e.target.files;
                if (!files.length) return;
                Array.from(files).forEach(file => {
                    if (!file.type.startsWith('image/')) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        let dataUrl = ev.target.result;
                        if (dataUrl.length > 500000) { const img = new Image();
                            img.onload = () => { const c = document.createElement('canvas');
                                c.width = img.width * 0.5;
                                c.height = img.height * 0.5;
                                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                                addScreenshot(file.name, c.toDataURL('image/jpeg', 0.7)); };
                            img.src = dataUrl; } else addScreenshot(file.name, dataUrl);
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            };

            function addScreenshot(name, dataUrl) { state.screenshots.unshift({ date: new Date().toISOString(), name,
                    dataUrl }); if (state.screenshots.length > 30) state.screenshots = state.screenshots.slice(0, 30);
                persist();
                renderGallery(); }

            function renderGallery() { const grid = document.getElementById('galleryGrid'); if (!state.screenshots
                    .length) { grid.innerHTML = '<p>No screenshots.</p>'; return; }
                grid.innerHTML = state.screenshots.map((s, i) =>
                    `<div class="gallery-item" onclick="viewScreenshot(${i})"><img src="${s.dataUrl}" alt="${s.name}"></div>`
                    ).join(''); }
            window.viewScreenshot = (i) => { const s = state.screenshots[i];
                document.getElementById('modalContent').innerHTML =
                    `<button class="btn btn-sm" onclick="closeModalDirect()">✕</button><img src="${s.dataUrl}" style="width:100%">`;
                document.getElementById('modalOverlay').style.display = 'flex'; };
            window.deleteScreenshot = (i) => { if (confirm('Delete?')) { state.screenshots.splice(i, 1);
                    persist();
                    renderGallery();
                    closeModalDirect(); } };
            window.clearScreenshots = () => { if (confirm('Clear all?')) { state.screenshots = [];
                    persist();
                    renderGallery(); } };

            window.closeModal = (e) => { if (e.target === document.getElementById('modalOverlay')) document.getElementById(
                    'modalOverlay').style.display = 'none'; };
            window.closeModalDirect = () => { document.getElementById('modalOverlay').style.display = 'none'; };

            const uploadZone = document.getElementById('uploadZone');
            uploadZone.addEventListener('dragover', e => { e.preventDefault();
                uploadZone.style.borderColor = 'var(--gold)'; });
            uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor = '');
            uploadZone.addEventListener('drop', e => { e.preventDefault();
                uploadZone.style.borderColor = ''; const dt = new DataTransfer();
                Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
                document.getElementById('fileInput').files = dt.files;
                handleFileUpload({ target: { files: dt.files } }); });

            document.getElementById('totalSeats').value = state.totalSeats;
            refresh();
            renderHistory();
            renderGallery();
            renderSavedReports();
        })();
    </script>
</body>
</html>
